name: Direct Runner - Source Connect Test

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "Target runner's externally reachable host/IP (if any)"
        required: true
        type: string
      target_port:
        description: "TCP listener port from target workflow"
        required: true
        default: "45454"
        type: string

permissions:
  contents: read

concurrency:
  group: direct-runner-source-probe
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs and test direct TCP connection
        shell: bash
        env:
          TARGET_HOST: ${{ inputs.target_host }}
          TARGET_PORT: ${{ inputs.target_port }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$TARGET_HOST" || "$TARGET_HOST" == *$'\n'* ]]; then
            echo "::error::target_host is empty or invalid."
            exit 2
          fi
          if ! [[ "$TARGET_PORT" =~ ^[0-9]+$ ]] || (( TARGET_PORT < 1024 || TARGET_PORT > 65535 )); then
            echo "::error::target_port must be an integer from 1024 to 65535."
            exit 2
          fi
          echo "UTC start: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/tcp_probe.py connect --host "$TARGET_HOST" --port "$TARGET_PORT" --timeout 8
