name: Direct Runner - Target Listener Probe

on:
  workflow_dispatch:
    inputs:
      listen_port:
        description: "TCP port to listen on"
        required: true
        default: "45454"

permissions:
  contents: read

concurrency:
  group: direct-runner-target-probe
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate port and show runner network information
        shell: bash
        env:
          LISTEN_PORT: ${{ inputs.listen_port }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$LISTEN_PORT" =~ ^[0-9]+$ ]] || (( LISTEN_PORT < 1024 || LISTEN_PORT > 65535 )); then
            echo "::error::Port must be an integer from 1024 to 65535."
            exit 2
          fi
          echo "UTC start: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Runner hostname: $(hostname)"
          echo "Local addresses:"
          ip -brief address || true
          echo "Public egress IP (diagnostic only):"
          curl --fail --silent --show-error --max-time 10 https://api.ipify.org || echo "Could not determine public egress IP"
          echo
          echo "Note: public egress IP does NOT prove inbound reachability."

      - name: Start TCP listener and wait
        shell: bash
        env:
          LISTEN_PORT: ${{ inputs.listen_port }}
        run: |
          set -Eeuo pipefail
          python3 scripts/tcp_probe.py listen --host 0.0.0.0 --port "$LISTEN_PORT" --timeout 1100
